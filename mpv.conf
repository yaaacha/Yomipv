# you can disable lines of this config by commenting them out by placing a '#' at the start of the line
hwdec=auto-safe

# set audio and subtitle language to Japanese.
ytdl-format="sub_1080p/sub_720p/sub_360p/bestvideo+bestaudio/best"
alang=jpn,ja,jp,Japanese,eng,en,english
slang=jpn,ja,Japanese,ind,id,Indonesian,eng,en,english
secondary-sid=auto
# you can change target language by editing jpn,jp,ja to other language codes: e.g. for Korean: kor,kr,ko

# you can press 'v' to toggle subtitles (to watch raw)
# uncomment this to disable subtitles by default
# sid=no

autocreate-playlist=same
audio-display=no
fs=yes
sub-auto=fuzzy

osd-bar=no


# ========== INTERFACE & YTDL ==========
idle=yes
force-window=yes

# [Inference] Deteksi otomatis lokasi yt-dlp berdasarkan OS
# Jalur macOS (Homebrew)
[macOS]
profile-cond=current_os == 'darwin'
script-opts=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp

# Jalur Windows (Asumsi yt-dlp.exe ada di folder MPV atau PATH)
[Windows]
profile-cond=current_os == 'win32' or current_os == 'cygwin'
script-opts=ytdl_hook-ytdl_path=yt-dlp.exe

# Jalur Linux
[Linux]
profile-cond=current_os == 'linux'
script-opts=ytdl_hook-ytdl_path=yt-dlp

# Kembali ke profil umum untuk opsi raw
[default]
ytdl-raw-options-add=user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
ytdl-raw-options-add=force-ipv4=

# ========== STYLING ==========
sub-font                     ="YuKyokasho"
sub-font-size                =45
sub-color                    ="#FFFFFF"
sub-border-size              =2
sub-shadow-offset            =1
sub-pos                      =95

secondary-sub-ass-override   =yes
secondary-sub-delay          =0
secondary-sub-pos            =10
